<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>曦语 · Glimmer</title>
<link rel="stylesheet" href="compact.css">
</head>
<body>
<main class="wrap">

  <!-- 顶部字幕横幅(播报时显示,逐段浮现) -->
  <div id="captionBar" class="caption-bar" hidden>
    <span class="caption-tag"><i></i>ON AIR</span>
    <div id="captionLines" class="caption-lines"></div>
  </div>

  <!-- 头部 -->
  <header class="hd">
    <div class="hd-dot"></div>
    <span class="hd-title">曦语</span>
    <span class="hd-sub">GLIMMER</span>
  </header>

  <!-- 时钟(主视觉) -->
  <section class="clock-block">
    <div id="clockTime" class="clock-time">--:--:--</div>
    <div id="clockDate" class="clock-date"></div>
  </section>

  <!-- 调谐条 + 状态 -->
  <section class="tuner">
    <div class="tuner-row">
      <span id="dialFreq" class="freq">FM 104.5</span>
      <span id="dialStatus" class="status">待机 STANDBY</span>
    </div>
    <div class="tuner-bar">
      <div class="tuner-scale"></div>
      <div id="dialNeedle" class="tuner-needle"></div>
    </div>
    <div id="eq" class="eq" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </section>

  <!-- 字幕区 -->
  <section class="stage">
    <p id="subtitle" class="stage-text">设定定时时间,到点后电台会送上 AI 激励语 ☀</p>
    <p id="stageState" class="stage-state"></p>
  </section>

  <!-- 定时播报卡片 -->
  <section class="card alarm-card">
    <div class="card-head">
      <label class="switch" title="闹钟开关">
        <input type="checkbox" id="alarmToggle">
        <span class="switch-track"></span>
      </label>
      <span class="card-title">定时播报</span>
      <span id="nextFire" class="meta">闹钟未开启</span>
    </div>
    <div id="alarmTimes" class="alarm-list" title="定时时间列表（点击 ✕ 删除）"></div>
    <div class="add-row">
      <input type="time" id="alarmTime" class="time-picker" value="07:30">
      <button id="addTimeBtn" class="btn btn-add">＋ 添加时段</button>
    </div>
  </section>

  <!-- 主操作按钮(圆形) -->
  <section class="actions">
    <button id="previewBtn" class="circle c-primary" title="试听">▶</button>
    <button id="pauseBtn" class="circle" title="暂停播放" hidden>⏸</button>
    <button id="stopBtn" class="circle" title="停止">■</button>
    <button id="settingsBtn" class="circle" title="设置">⚙</button>
  </section>

  <!-- 设置面板(底部抽屉) -->
  <section class="panel" id="panel" hidden>
    <button id="panelClose" class="panel-close" type="button" title="关闭">✕</button>
    <div class="panel-title">设置</div>
    <fieldset>
      <label class="field">
        <span>你的称呼（可选）</span>
        <input type="text" id="userName" placeholder="如:谭雅" maxlength="20">
      </label>
    </fieldset>
    <fieldset>
      <div id="emotions" class="emotions"></div>
    </fieldset>
    <fieldset>
      <label class="field">
        <span>声音音色</span>
        <select id="voiceSelect"></select>
      </label>
      <button id="voiceTestBtn" class="btn block">🔊 试听当前音色</button>
    </fieldset>
    <fieldset id="bootSection" hidden>
      <label class="chk">
        <input type="checkbox" id="launchOnBoot">
        开机自启动（开机后约 1 分钟自动播放）
      </label>
    </fieldset>
  </section>
</main>

<script src="js/config.js"></script>
<script src="js/voices.js"></script>
<script src="js/ai.js"></script>
<script src="js/tts.js"></script>
<script src="js/sounds.js"></script>
<script src="js/minimaxTts.js"></script>
<script src="js/alarm.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script>
  // 设置抽屉：✕ 关闭(打开逻辑复用 ui.js 的 ⚙ 按钮)
  document.getElementById('panelClose').addEventListener('click', function () {
    document.getElementById('panel').hidden = true;
  });
</script>
</body>
</html>
